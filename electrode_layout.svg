<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="840" height="320" font-family="sans-serif" font-size="12">
  <rect x="10" y="10" width="400" height="140" rx="20" fill="#f4f4f4" stroke="#888"/>
  <text x="210" y="32" text-anchor="middle" fill="#333">Flex PCB, polyimide, skin side (schematic, not to scale)</text>
  <text x="210" y="58" text-anchor="middle" fill="#555">Orient along radial artery. Pad diameter 6 mm, ENIG gold + hydrogel Ag/AgCl.</text>
